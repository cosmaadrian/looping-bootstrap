$extends$: configs/pretraining-config.yaml

dataset: deepmind_mathematics
dataset_args:
  dataset_name: data/deepmind_mathematics
  subset: ""
  chunk_size: 256
  train_split: train
  test_split: interpolate
  max_eval_samples: 8192

model_checkpoint:
  save_model: 0
  override_checkpoints: 1
  monitor_quantity: "math_interpolate#accuracy@16_loops"
  direction: up
  base_dir: 'checkpoints/'
  delete_previous: True
  total_saves: 10

evaluators:
  - name: deepmind_mathematics
    dataset: deepmind_mathematics
    kind: interpolate
    args:
      display_name: math_interpolate
      dataset_name: data/deepmind_mathematics
      depths: [1, 2, 4, 8, 16]
      temperature: 0.0
      top_p: 1.0
  - name: deepmind_mathematics
    dataset: deepmind_mathematics
    kind: extrapolate
    args:
      display_name: math_extrapolate
      dataset_name: data/deepmind_mathematics
      depths: [1, 2, 4, 8, 16]
      temperature: 0.0
      top_p: 1.0
